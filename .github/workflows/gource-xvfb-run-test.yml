name: Gource xvfb-run test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xvfb + gource
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb gource
      - name: Test xvfb-run + gource
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            echo "DISPLAY=$DISPLAY"
            timeout 20 gource --max-files 100 --key -800x600 --output-framerate 25 -s 0.6 --stop-at-end --hide mouse,progress -o /tmp/test.ppm . 2>&1 | tail -5
            echo "gource exit: $?"
            ls -la /tmp/test.ppm || echo "no ppm"
          '
